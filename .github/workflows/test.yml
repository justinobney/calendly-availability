name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install package
        run: python -m pip install .

      - name: Test Python behavior
        run: python -m unittest discover -s tests -v

      - name: Check browser JavaScript
        run: node --check src/calendly_availability/web/app.js

      - name: Check installed command
        run: calendly-availability --help

  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing/video

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: marketing/video/package-lock.json

      - name: Install video dependencies
        run: npm ci

      - name: Type-check Remotion source
        run: npm exec tsc -- --noEmit
